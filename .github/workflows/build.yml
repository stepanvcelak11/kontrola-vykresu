name: Testy a sestavení .exe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Systémové knihovny pro Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
        env:
          QT_QPA_PLATFORM: offscreen

  exe-windows:
    runs-on: windows-latest
    needs: testy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
      - run: pyinstaller --noconfirm --clean kontrola_vykresu.spec
      - name: Sestavené .exe zkontroluje ukázkový výkres (CSV, Excel, PDF, DXF)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/KontrolaVykresu.exe -Wait -PassThru -ArgumentList @(
            "zkontroluj", "ukazky/ukazkovy_vykres.dxf", "--pravidla", "ukazky/konfigurace.yaml",
            "--csv", "chyby.csv", "--xlsx", "chyby.xlsx", "--pdf", "protokol.pdf", "--dxf", "kontrola.dxf")
          if ($p.ExitCode -ne 1) { throw "Očekáván návratový kód 1 (výkres obsahuje chyby), je $($p.ExitCode)" }
          foreach ($f in "chyby.csv", "chyby.xlsx", "protokol.pdf", "kontrola.dxf") {
            if (!(Test-Path $f)) { throw "Chybí výstup $f" }
          }
          $n = (Get-Content chyby.csv -Encoding UTF8 | Measure-Object -Line).Lines - 1
          if ($n -lt 20) { throw "Očekáváno aspoň 20 chyb, nalezeno $n" }
          Write-Host "Nalezeno chyb: $n"
          exit 0
      - name: Sestavené .exe spustí grafické okno bez pádu
        shell: pwsh
        run: |
          $env:HOME = "$env:RUNNER_TEMP"
          $p = Start-Process -FilePath dist/KontrolaVykresu.exe -PassThru -ArgumentList "ukazky/ukazkovy_vykres.dxf"
          Start-Sleep -Seconds 20
          if ($p.HasExited) { throw "Aplikace skončila předčasně s kódem $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Write-Host "Okno běželo 20 s bez pádu."
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: KontrolaVykresu-windows
          path: dist/KontrolaVykresu.exe
