name: Testy a sestavení .exe

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Systémové knihovny pro Qt
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
        env:
          QT_QPA_PLATFORM: offscreen

  exe-windows:
    runs-on: windows-latest
    needs: testy
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m pytest -q tests
      - run: pyinstaller --noconfirm --clean kontrola_vykresu.spec
      - name: Kontrola, že .exe umí zkontrolovat ukázkový výkres
        shell: pwsh
        run: |
          python spustit.py zkontroluj ukazky/ukazkovy_vykres.dxf --pravidla ukazky/konfigurace.yaml --csv chyby.csv
          if ($LASTEXITCODE -ne 1) { throw "Očekáván návratový kód 1 (výkres obsahuje chyby)" }
          if (!(Test-Path dist/KontrolaVykresu.exe)) { throw "Chybí dist/KontrolaVykresu.exe" }
          exit 0
      - uses: actions/upload-artifact@v4
        with:
          name: KontrolaVykresu-windows
          path: dist/KontrolaVykresu.exe
